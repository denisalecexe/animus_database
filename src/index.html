<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/favicon/abstergo-favicon.ico" type="image/x-icon">

    <title>drxANIMUS 1.0</title>

<body>
    <div id="animus">
        <div class="animus-wrapper">
            <!-- HEADER DEL DATABASE ANIMUS -->
            <header id="header">
                <!-- SEZIONE HEADER DEL MENU -->
                <div class="menu-animus">
                    <span class="database"><i class="bi bi-database"></i></span>
                    <span class="mapGlobes"><i class="bi bi-globe-americas"></i></span>
                    <span class="geneticTree"><i class="bi bi-diagram-3"></i></span>

                <!-- SEZIONE HEADER PROFILO -->
                <div class="profile">
                    <span class="iconProfile"><i class="bi bi-person-bounding-box"></i></span>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                    <div class="statsProfile"></div>
                </div>

                <!-- SEZIONE HEADER IMPOSTAZIONI -->
                <div class="settings">
                    <span class="iconSettings"><i class="bi bi-gear-wide-connected"></i></span>
                </div>
            </header>

            <!-- BODY DELL'ANIMUS -->
            <main id="bodypage">

            </main>

            <!-- FOOTER DELL'ANIMUS -->
            <footer id="footer">
                <!-- SEZIONE FOOTER DEI CONTATTI -->
                <div class="contact"></div>

                <!-- SEZIONE FOOTER DI AIUTO -->
                <div class="help"></div>

                <!-- SEZIONE FOOTER DI COPYRIGHT -->
                <div class="copyright"></div>
            </footer>
        </div>
    </div>

    
    <script src="./js/script.js"></script>
